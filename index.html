<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23ffb347'/%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%235fd4ff' stroke-width='1.4' opacity='0.7'/%3E%3C/svg%3E" />
    <meta name="theme-color" content="#04070c" />
    <meta name="description" content="Explore an interactive 3D solar system with searchable planets, camera controls and current IST time." />
    <title>Solar System Explorer | Live 3D</title>
  </head>
  <body>
    <!-- Loading overlay: present in static HTML so it paints before the heavy
         procedural-texture generation work begins. -->
    <div id="loading">
      <div class="loading-box">
        <div class="loading-title">SOLAR SYSTEM EXPLORER</div>
        <div class="loading-bar"><div class="loading-bar-fill"></div></div>
        <div class="loading-status" id="loading-status">INITIALIZING&hellip;</div>
      </div>
    </div>

    <!-- three.js canvas mounts here -->
    <div id="app"></div>

    <!-- floating body-name labels (projected each frame) -->
    <div id="labels"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
